# Render Blueprint — GitHub 연동 후 Web Service로 배포
# https://dashboard.render.com/blueprints

services:
  - type: web
    name: makeroom
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: SYNC_PASSWORD
        sync: false
